        - heading "The licence doesn't see everything." [level=3] [ref=e106]
        - paragraph [ref=e107]: ChatGPT Enterprise and Copilot cover people in a browser. They don't cover your applications and agents calling model APIs directly, or the personal accounts staff still use.
      - generic [ref=e108]:
        - generic [ref=e109]: "02"
        - heading "Blocking stops the work." [level=3] [ref=e110]
        - paragraph [ref=e111]: Traditional DLP either lets a prompt through or walls the user off — so they switch to a personal device and you lose visibility entirely.
