          - heading "The licence doesn't see everything." [level=3] [ref=e113]
          - paragraph [ref=e114]: ChatGPT Enterprise and Copilot cover people in a browser. They don't cover your applications and agents calling model APIs directly, or the personal accounts staff still use.
        - generic [ref=e115]:
          - generic [ref=e116]: "02"
          - heading "Blocking stops the work." [level=3] [ref=e117]
          - paragraph [ref=e118]: Traditional DLP either lets a prompt through or walls the user off — so they switch to a personal device and you lose visibility entirely.
        - generic [ref=e119]:
          - generic [ref=e120]: "03"
          - heading "You can't prove any of it." [level=3] [ref=e121]
          - paragraph [ref=e122]: Only ~a third of organisations send AI logs anywhere an auditor would accept. The contract transfers liability; it doesn't produce evidence.
