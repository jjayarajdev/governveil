<script>
/* Pre-paint variant resolution for the nine marketing pages, so a stored or
   forced choice does not flash the other skin. Mirrors src/gv/variant.js —
   keep the two in step. The Learn and GTM routes are antd and must not get the
   attribute at all. */
(function () {
  if (location.hostname.indexOf('learn.') === 0) return;
  if (/[?&]learn\b/.test(location.search + location.hash)) return;
  var h = location.hash.replace(/^#/, '') || '/';
  var path = h.split('?')[0];
  if (path === '/learn' || path === '/gtm') return;
  var forced = /[?&]v=(dark|light)/.exec(location.search + location.hash);
  if (forced) { document.documentElement.setAttribute('data-gv', forced[1]); return; }
  try {
    var v = localStorage.getItem('gv-variant');
    document.documentElement.setAttribute('data-gv', v === 'dark' ? 'dark' : 'light');
  } catch (e) {
    document.documentElement.setAttribute('data-gv', 'light');
  }
})();
</script>
